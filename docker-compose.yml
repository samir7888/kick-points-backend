# Local development stack.
#
# Postgres and Redis are hosted services (Neon + Upstash) rather than local
# containers, so this file only runs the application processes. The
# DATABASE_URL and REDIS_URL values are read from .env via `env_file`, which
# keeps the credentials out of this tracked file.

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/prometheus
    env_file:
      - .env
    volumes:
      - .:/app
      - prometheus_metrics:/prometheus
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Background Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/prometheus
    env_file:
      - .env
    volumes:
      - .:/app
      - prometheus_metrics:/prometheus
    command: arq app.workers.settings.WorkerSettings

  # Prediction Listener
  listener:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/prometheus
    env_file:
      - .env
    volumes:
      - .:/app
      - prometheus_metrics:/prometheus
    command: python -m app.workers.listener

volumes:
  prometheus_metrics:
