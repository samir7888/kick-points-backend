name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: kick_predictions
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run database migrations
        env:
          DATABASE_URL: ******localhost:5432/kick_predictions
        run: uv run alembic upgrade head

      - name: Run linting
        run: |
          uv run ruff check .
          uv run mypy app/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/kick_predictions
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-minimum-32-chars-long
          TOKEN_ENCRYPTION_KEYS: test-key-for-ci-only-not-secure
          KICK_CLIENT_ID: test_client_id
          KICK_CLIENT_SECRET: test_client_secret
          DODO_API_KEY: test_dodo_key
          DODO_WEBHOOK_SECRET: test_webhook_secret
          DODO_PREMIUM_PRODUCT_ID: test_product_id
        run: uv run pytest -v --cov=app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
