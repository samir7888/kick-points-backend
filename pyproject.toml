[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kick-prediction-backend"
version = "0.1.0"
description = "FastAPI backend for Kick.com prediction auto-voting SaaS"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kick Prediction Bot", email = "dev@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.25.0",
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "python-multipart>=0.0.7",
    # Legacy Kick integration: real gateway (cloudscraper API client +
    # websocket-client Pusher listener + loguru logging).
    "cloudscraper>=1.2.71",
    "websocket-client>=1.7.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-redis>=4.6.0",
    "fakeredis>=2.20.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["legacy/"]

[[tool.mypy.overrides]]
module = "legacy.*"
ignore_errors = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"